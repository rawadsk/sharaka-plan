    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكيل البحث عن عمل في روسيا</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="./وكيل البحث عن عمل في روسيا_files/css2" rel="stylesheet">
    <link rel="stylesheet" href="./وكيل البحث عن عمل في روسيا_files/styles.css">
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">
          <span class="mark">РА</span>
          <div>
            <h1>وكيل الوظائف الروسية</h1>
            <p>يبحث لك في hh.ru وРабота России حسب ملفك</p>
          </div>
        </div>
        <div class="status" id="status">جاهز للبحث</div>
      </header>

      <main class="layout">
        <section class="panel">
          <h2>ملفك المهني</h2>
          <form id="profile-form">
            <label>
              المسمى الوظيفي
              <input name="title" required="" placeholder="Frontend Developer / переводчик">
            </label>
            <label>
              المهارات (مفصولة بفاصلة)
              <input name="skills" placeholder="JavaScript, React, العربية, русский">
            </label>
            <label>
              المدينة
              <select name="city">
                <option value="">كل روسيا</option>
                <option value="Москва">موسكو</option>
                <option value="Санкт-Петербург">سانت بطرسبرغ</option>
                <option value="Казань">قازان</option>
                <option value="Новосибирск">نوفوسيبيرسك</option>
                <option value="Екатеринбург">يكاترينبورغ</option>
                <option value="Нижний Новгород">نيجني نوفغورود</option>
                <option value="Краснодар">كراسنودار</option>
              </select>
            </label>
            <div class="row">
              <label>
                الحد الأدنى للراتب (₽)
                <input name="minSalary" type="number" min="0" step="10000" placeholder="80000">
              </label>
              <label>
                الخبرة
                <select name="experience">
                  <option value="">أي مستوى</option>
                  <option value="noExperience">بدون خبرة</option>
                  <option value="between1And3">1–3 سنوات</option>
                  <option value="between3And6">3–6 سنوات</option>
                  <option value="moreThan6">أكثر من 6</option>
                </select>
              </label>
            </div>
            <label class="check">
              <input type="checkbox" name="remote">
              عمل عن بُعد فقط
            </label>
            <label>
              كلمات مفتاحية إضافية
              <input name="keywords" placeholder="удалённо, arabic, MENA">
            </label>
            <button type="submit" id="search-btn">ابدأ بحث الوكيل</button>
          </form>
        </section>

        <section class="results">
          <div class="results-head">
            <h2>نتائج الوكيل</h2>
            <span id="meta"></span>
          </div>
          <ul class="advice" id="advice"></ul>
          <div id="jobs" class="jobs empty">أدخل ملفك ثم اضغط البحث. سيجلب الوكيل الوظائف من المنصات الروسية ويرتّبها حسب التطابق.</div>
        </section>
      </main>
    </div>
    <script type="module" src="./وكيل البحث عن عمل في روسيا_files/main.js.download"></script>
  

</body></html>
